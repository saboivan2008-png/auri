<!doctype html><html lang="sk"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AURA Console</title><style>body{font-family:system-ui;max-width:720px;margin:40px auto;padding:20px;background:#111;color:#eee}textarea,input,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #444;background:#1d1d1d;color:#fff}button{cursor:pointer;background:#fff;color:#111;font-weight:700}pre{white-space:pre-wrap;background:#181818;padding:14px;border-radius:10px}</style><h1>AURA</h1><p>Live agent console</p><input id="token" type="password" placeholder="AURA API token"><textarea id="task" rows="6" placeholder="Zadaj úlohu AURE..."></textarea><button id="run">Spustiť AURU</button><pre id="out">Pripravená.</pre><script>const $=id=>document.getElementById(id);$('run').onclick=async()=>{const token=$('token').value.trim(),task=$('task').value.trim();if(!token||!task){$('out').textContent='Vyplň token a úlohu.';return}$('out').textContent='AURA pracuje…';try{const r=await fetch('/api/agent',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token},body:JSON.stringify({task})});const d=await r.json();$('out').textContent=JSON.stringify(d,null,2)}catch(e){$('out').textContent='Chyba spojenia: '+e.message}}</script></html>
